server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Client-uploaded files are served exclusively through authenticated
    # Laravel routes (FileDownloadController) now, which check the request
    # belongs to the file's owner or an admin before streaming it from this
    # same on-disk location. Direct requests to this path must never reach
    # the file at all — neither as a script nor as a static asset — or that
    # auth check would be bypassable via the raw URL.
    location ^~ /client-uploads/ {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
