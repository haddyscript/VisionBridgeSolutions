server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Client-uploaded files must never be executed as scripts, even if a
    # future validation gap lets one land with an executable extension.
    # The ^~ prefix wins over the regex \.php$ location below for this path,
    # so uploads are served as static files only.
    location ^~ /client-uploads/ {
        location ~ \.(php\d?|phtml|pl|py|cgi|asp|aspx|sh|cshtml)$ {
            deny all;
        }
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
